# ofelia reads this file only when it starts: after a change, recreate qa-ofelia
# (`docker compose -p results up -d --no-deps --force-recreate qa-ofelia`, deployment/README.md
# "Database"); `docker logs qa-ofelia` then lists every job as "New job registered".

[job-exec "backup-interossea-db"]
schedule = {{ $config.backup.schedule }}
container = qa-interossea-db
command = bash -c 'rm -rf /backup/interossea";" mongodump --host qa-interossea-db --port {{ $config.interossea.server.db.port }} --username root --password $MONGODB_ROOT_PASSWORD --out /backup'

[job-exec "backup-qa-db"]
schedule = {{ $config.backup.schedule }}
container = qa-db
command = bash -c 'rm -rf /backup/queer-augsburg";" mongodump --host qa-db --port {{ $config.qa.db.port }} --username root --password $MONGODB_ROOT_PASSWORD --out /backup'

# pg_dump into the same volume, so backup_script.py archives it with the rest. Written next
# to the final name and renamed, so an archive never contains a half-written dump. Restore:
# `pg_restore --clean --if-exists -U qa_owner -d queer-augsburg /backup/queer-augsburg.pgdump`;
# deployment/pg-restore-check.sh proves a dump restores. No password: the image trusts the unix
# socket inside the container. deployment/tests/postgres.sh runs this command.
[job-exec "backup-qa-pg"]
schedule = {{ $config.backup.schedule }}
container = qa-pg
command = sh -c 'pg_dump -Fc -U qa_owner -d queer-augsburg -f /backup/queer-augsburg.pgdump.part && mv -f /backup/queer-augsburg.pgdump.part /backup/queer-augsburg.pgdump'