[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1.47.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    "net",
] }
http = "1.0"
serde_valid = "0.25"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
lettre = { version = "0.11.10", default-features = false, features = [
    "rustls-tls",
    "smtp-transport",
    "hostname",
    "builder",
] }

icalendar = "0.17.5"



# bson comes only through `mongodb::bson`, so that both always agree on the version.
mongodb = "3.10.0"
futures = "0.3"

serde = { version = "1.0", features = [
    "derive",
    "std",
], default-features = false }
serde_yaml = { version = "0.9.34+deprecated" }
serde_json = { version = "1" }
anyhow = "1"
lazy_static = "1.3.0"

# Newer majors need a crypto backend of their own: aws-lc (C, in the static musl build) or
# `rsa`, which has an open advisory. Stay here while `cargo audit` is clean.
jsonwebtoken = "9"
# No TLS feature: only fetches the login service's key inside the Docker network, so
# `interossea.url` must stay http://.
reqwest = { version = "0.13.5", default-features = false }
once_cell = "1"
cookie = "0.18.0"
chrono = "0.4.22"
rand = "0.8.5"
ts-rs = "7.0.0"
base64 = "0.22"
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }
unicode-normalization = "0.1.26"
chrono-tz = { version = "0.10.4", features = ["filter-by-regex"] }
