[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/main.rs"

# The one-shot tools of the Postgres cutover (research-postgres §4). Off in the server image;
# `Dockerfile.migrate` builds them. Both go with the `mongo-source` feature after the window.
[[bin]]
name = "migrate-from-mongo"
path = "src/bin/migrate-from-mongo.rs"
required-features = ["mongo-source"]

[[bin]]
name = "anonymize-dump"
path = "src/bin/anonymize-dump.rs"
required-features = ["mongo-source"]

[features]
# Reading mongodump directories (`src/migrate`): the migrator and the dump anonymizer.
mongo-source = ["dep:bson", "dep:sha2"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1.47.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    "net",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
http = "1.0"
serde_valid = "0.25"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
lettre = { version = "0.11.10", default-features = false, features = [
    "rustls-tls",
    "smtp-transport",
    "hostname",
    "builder",
] }

icalendar = "0.17.5"



# No TLS feature: the database is on the private compose network, like interossea.
# Queries are checked at compile time against `DATABASE_URL`, or offline against the
# committed `.sqlx/` cache (`cargo sqlx prepare`; `SQLX_OFFLINE=true` in the image build).
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "macros",
    "migrate",
    "json",
] }
# Only `BoxFuture`, `BoxStream` and `TryStreamExt`; the `futures` meta crate was for the
# MongoDB driver.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

serde = { version = "1.0", features = [
    "derive",
    "std",
], default-features = false }
serde_yaml = { version = "0.9.34+deprecated" }
# `preserve_order`: objects keep the order their keys were written in. The MongoDB build had
# it through `bson` 2, so `json!` values (the awareness entries of document_rooms.rs) go out
# byte for byte as before.
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
lazy_static = "1.3.0"

# Newer majors need a crypto backend of their own: aws-lc (C, in the static musl build) or
# `rsa`, which has an open advisory. Stay here while `cargo audit` is clean.
jsonwebtoken = "9"
# No TLS feature: only fetches the login service's key inside the Docker network, so
# `interossea.url` must stay http://.
reqwest = { version = "0.13.5", default-features = false }
once_cell = "1"
cookie = "0.18.0"
chrono = "0.4.22"
rand = "0.8.5"
ts-rs = "7.0.0"
base64 = "0.22"
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }
unicode-normalization = "0.1.26"
regex = "1"
# Pinned: its sync protocol has to match the y-websocket client in web/package.json.
yrs = { version = "=0.28.1", features = ["sync"] }
chrono-tz = { version = "0.10.4", features = ["filter-by-regex"] }

# Only with `mongo-source`: the BSON of mongodump files (no driver, the migrator reads a dump
# directory) and the digests of the migration report.
bson = { version = "3.1.0", optional = true, features = [
    "serde",
    "serde_json-1",
] }
sha2 = { version = "0.11.1", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
# The slow-login proxy of tests/migrator.rs.
tokio = { version = "1.47.1", default-features = false, features = ["io-util"] }

# `SIOCOUTQ` for the row-holding proxy of tests/document_search_load.rs, a Linux-only test.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.191"
