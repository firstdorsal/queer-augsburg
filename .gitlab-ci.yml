image: docker:latest

stages:
    - test
    - docker-build
# v1 tests run before the image builds; a failing test stops the pipeline before any
# image is pushed. The web tests also read shared fixtures from server/ (validation and
# place name cases, the places migration), so the web job needs the full checkout.
# Images are built only on the default branch: every build is pushed as :latest (what
# turing pulls) and as :<short sha> (to roll back to).
test-server:
    stage: test
    image: rust:1
    rules:
        - changes:
            - server/**/*
            - web/src/apiTypes/**/*
            - .gitlab-ci.yml
    script:
        - cd server
        - cargo test --locked
        # ts-rs regenerates web/src/apiTypes during the tests; they must be committed.
        - |
            if [ -n "$(git status --porcelain -- ../web/src/apiTypes)" ]; then
                git status --porcelain -- ../web/src/apiTypes
                echo "web/src/apiTypes is out of date: run cargo test in server/ and commit it"
                exit 1
            fi

test-web:
    stage: test
    image: node:24-alpine
    rules:
        - changes:
            - web/**/*
            - server/src/meeting_validation_cases.json
            - server/src/place_key_cases.json
            - server/migrations/**/*
            - .gitlab-ci.yml
    script:
        - cd web
        - corepack enable pnpm
        - pnpm install --frozen-lockfile
        - pnpm test

docker-build-server:
    stage: docker-build
    image:
        name: gcr.io/kaniko-project/executor:debug
        entrypoint: [""]
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes:
            - server/src/**/*
            - server/Cargo.toml
            - server/Cargo.lock
            - server/Dockerfile
    script:
        - export CI_PUBLIC_REGISTRY=index.docker.io
        - export CI_PRIVATE_REGISTRY=hub.vindelicum.eu
        - export IMAGE_NAME=firstdorsal/queer-augsburg-server
        - export DOCKER_PATH=/server/
        - mkdir -p /kaniko/.docker
        - echo "{\"auths\":{\"https://${CI_PUBLIC_REGISTRY}/v1/\":{\"auth\":\"$(printf "%s:%s" "firstdorsal" "${CI_PUBLIC_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"},\"https://${CI_PRIVATE_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "docker" "${CI_PRIVATE_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
        - >-
            nice -n 19 /kaniko/executor
            --cache=true
            --context="${CI_PROJECT_DIR}${DOCKER_PATH}"
            --cache-repo=${CI_PRIVATE_REGISTRY}/${IMAGE_NAME}/cache
            --dockerfile="Dockerfile"
            --destination="${CI_PUBLIC_REGISTRY}/${IMAGE_NAME}"
            --destination="${CI_PUBLIC_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"

docker-build-web:
    stage: docker-build
    image:
        name: gcr.io/kaniko-project/executor:debug
        entrypoint: [""]
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes:
            - web/**/*
    script:
        - export CI_PUBLIC_REGISTRY=index.docker.io
        - export CI_PRIVATE_REGISTRY=hub.vindelicum.eu
        - export IMAGE_NAME=firstdorsal/queer-augsburg-web
        - export DOCKER_PATH=/web/
        - mkdir -p /kaniko/.docker
        - echo "{\"auths\":{\"https://${CI_PUBLIC_REGISTRY}/v1/\":{\"auth\":\"$(printf "%s:%s" "firstdorsal" "${CI_PUBLIC_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"},\"https://${CI_PRIVATE_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "docker" "${CI_PRIVATE_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
        - >-
            nice -n 19 /kaniko/executor
            --cache=true
            --context="${CI_PROJECT_DIR}${DOCKER_PATH}"
            --cache-repo=${CI_PRIVATE_REGISTRY}/${IMAGE_NAME}/cache
            --dockerfile="Dockerfile"
            --destination="${CI_PUBLIC_REGISTRY}/${IMAGE_NAME}"
            --destination="${CI_PUBLIC_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
